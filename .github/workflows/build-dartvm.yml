name: Build dartvm (v4 — Static Capstone)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    # 回写 version.json / manifest.json 到 main 时不重新触发全量构建（paths 过滤对 tag 推送不生效）
    paths-ignore:
      - 'version.json'
      - 'manifest.json'
  workflow_dispatch:
    inputs:
      dart-version:
        description: 'Build single version (empty = all)'
        required: false
        type: string
      ndk-version:
        description: 'Android NDK version'
        required: false
        default: 'r27'
        type: string

env:
  NDK_VERSION: ${{ inputs.ndk-version || 'r27' }}
  DART_VERSIONS: '3.13.0 3.12.2 3.12.1 3.12.0 3.11.6 3.11.5 3.11.4 3.11.3 3.11.2 3.11.1 3.11.0 3.10.9 3.10.8 3.10.7 3.10.6 3.10.5 3.10.4 3.10.3 3.10.2 3.10.1 3.10.0 3.9.4 3.9.3 3.9.2 3.9.1 3.9.0 3.8.3 3.8.2 3.8.1 3.8.0 3.7.3 3.7.2 3.7.1 3.7.0 3.6.2 3.6.1 3.6.0 3.5.4 3.5.3 3.5.2 3.5.1 3.5.0 3.4.4 3.4.3 3.4.2 3.4.1 3.4.0 3.3.4 3.3.3 3.3.2 3.3.1 3.3.0 3.2.6 3.2.5 3.2.4 3.2.3 3.2.2 3.2.1 3.2.0 3.1.5 3.1.4 3.1.3 3.1.2 3.1.1 3.1.0 3.0.7 3.0.6 3.0.5 3.0.4 3.0.3 3.0.2 3.0.1 3.0.0 2.19.6 2.19.5 2.19.4 2.19.3 2.19.2 2.19.1 2.19.0 2.18.7 2.18.6'
  # releaseNotes：发版前更新为本次新增版本 + 更新内容
  # 说明：版本唯一数据源是下方 matrix；manifest.json 由打包阶段按实际构建产物自动枚举生成。
  RELEASE_NOTES: 'v0.5.1：修复 2.19.x 与 3.0.x 引擎构建失败——OLD_MAP_SET_NAME 此前按主版本号误覆盖 2.19（LinkedHashMap/LinkedHashSet 已于 Dart 2.19 改名 Map/Set）；HAS_TYPE_REF 漏掉 3.0（TypeRef 于 Dart 3.1 才移除，3.0 需走 TypeParameter.bound() 路径）。两宏改为按 SDK class_id.h 头文件特征自动检测（V(LinkedHashMap)/V(TypeRef)），自此 82 个版本（2.18.6~3.13.0）全部可构建；引擎资产按 Dart 版本独立 7z + 必装运行库 fler-runtime-libs.7z + manifest.json，每版本按需下载。'

jobs:
  # ══════════════════════════════════════════════════════════
  # STAGE 1: Build shared libraries (once, reused across versions)
  # ══════════════════════════════════════════════════════════
  shared-libs:
    name: Build Shared Libraries (capstone.a + ICU + c++_shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fler-dart
        uses: actions/checkout@v4
        with:
          path: fler-dart

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 python3-pip \
            curl git file p7zip-full patchelf

      - name: Setup Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Cache shared libs build (Capstone + ICU sources and builds)
        id: cache-shared-libs-build
        uses: actions/cache@v4
        with:
          path: |
            /tmp/fler-dart-cache/shared_libs/capstone-src
            /tmp/fler-dart-cache/shared_libs/capstone_build
            /tmp/fler-dart-cache/shared_libs/icu-src
            /tmp/fler-dart-cache/shared_libs/icu-host-build
            /tmp/fler-dart-cache/shared_libs/icu-cross-build
          key: shared-libs-${{ env.NDK_VERSION }}-icu73-2-capstone5-0-9-static-v2

      - name: Build shared libraries
        run: |
          bash fler-dart/scripts/build-dartvm.sh \
            --build-shared-libs-only \
            --ndk-path $ANDROID_NDK_HOME \
            --output-dir "$(pwd)/output" \
            --build-root "/tmp/fler-dart-cache/shared_libs"

      - name: Verify shared libs
        run: |
          echo "=== Shared libraries ==="
          ls -lh output/shared_libs/
          echo ""
          for f in output/shared_libs/libcapstone.*; do
            [ -f "$f" ] && file "$f"
          done
          echo ""
          for f in output/shared_libs/*.so; do
            [ -f "$f" ] && file "$f"
          done

      - name: Upload shared libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared_libs
          path: |
            output/shared_libs/*.so
            output/shared_libs/*.a
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # STAGE 2: Build version-specific engines (matrix, parallel)
  # ══════════════════════════════════════════════════════════
  build-engines:
    name: Build Engine ${{ matrix.dart-version }}
    needs: shared-libs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GitHub Actions 的 matrix 表达式无法读取 env 上下文（仅 steps/job env 可用），
        # 因此这里显式列出版本 —— 版本唯一数据源；manifest.json 由打包阶段按实际产物
        # 自动枚举生成，发版新增/调整版本时只改此处 matrix。
        dart-version:
          - '3.13.0'
          - '3.12.2'
          - '3.12.1'
          - '3.12.0'
          - '3.11.6'
          - '3.11.5'
          - '3.11.4'
          - '3.11.3'
          - '3.11.2'
          - '3.11.1'
          - '3.11.0'
          - '3.10.9'
          - '3.10.8'
          - '3.10.7'
          - '3.10.6'
          - '3.10.5'
          - '3.10.4'
          - '3.10.3'
          - '3.10.2'
          - '3.10.1'
          - '3.10.0'
          - '3.9.4'
          - '3.9.3'
          - '3.9.2'
          - '3.9.1'
          - '3.9.0'
          - '3.8.3'
          - '3.8.2'
          - '3.8.1'
          - '3.8.0'
          - '3.7.3'
          - '3.7.2'
          - '3.7.1'
          - '3.7.0'
          - '3.6.2'
          - '3.6.1'
          - '3.6.0'
          - '3.5.4'
          - '3.5.3'
          - '3.5.2'
          - '3.5.1'
          - '3.5.0'
          - '3.4.4'
          - '3.4.3'
          - '3.4.2'
          - '3.4.1'
          - '3.4.0'
          - '3.3.4'
          - '3.3.3'
          - '3.3.2'
          - '3.3.1'
          - '3.3.0'
          - '3.2.6'
          - '3.2.5'
          - '3.2.4'
          - '3.2.3'
          - '3.2.2'
          - '3.2.1'
          - '3.2.0'
          - '3.1.5'
          - '3.1.4'
          - '3.1.3'
          - '3.1.2'
          - '3.1.1'
          - '3.1.0'
          - '3.0.7'
          - '3.0.6'
          - '3.0.5'
          - '3.0.4'
          - '3.0.3'
          - '3.0.2'
          - '3.0.1'
          - '3.0.0'
          - '2.19.6'
          - '2.19.5'
          - '2.19.4'
          - '2.19.3'
          - '2.19.2'
          - '2.19.1'
          - '2.19.0'
          - '2.18.7'
          - '2.18.6'

    steps:
      - name: Checkout fler-dart
        uses: actions/checkout@v4
        with:
          path: fler-dart

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build python3 python3-pip \
            curl git file libicu-dev

      - name: Setup Android NDK ${{ env.NDK_VERSION }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Download shared libs
        uses: actions/download-artifact@v4
        with:
          name: shared_libs
          path: output/shared_libs

      - name: Cache Blutter + build artifacts
        id: cache-dartvm
        uses: actions/cache@v4
        with:
          path: |
            /tmp/fler-dart-cache/dartvm_${{ matrix.dart-version }}/blutter
            /tmp/fler-dart-cache/dartvm_${{ matrix.dart-version }}/blutter/packages
          key: dartvm-${{ matrix.dart-version }}-${{ env.NDK_VERSION }}-v16-static-capstone
          restore-keys: |
            dartvm-${{ matrix.dart-version }}-${{ env.NDK_VERSION }}-v14

      - name: Patch blutter_entry.cpp (TMPDIR support)
        run: bash fler-dart/scripts/patch-tmpdir.sh


      - name: Build dartvm.so (static capstone)
        run: |
          mkdir -p output
          bash fler-dart/scripts/build-dartvm.sh \
            --dart-version ${{ matrix.dart-version }} \
            --ndk-path $ANDROID_NDK_HOME \
            --output-dir "$(pwd)/output" \
            --build-root "/tmp/fler-dart-cache/dartvm_${{ matrix.dart-version }}" \
            --prebuilt-shared-libs-dir "$(pwd)/output/shared_libs"

      - name: Verify output
        run: |
          echo "=== Engine .so files for ${{ matrix.dart-version }} ==="
          ls -lh output/
          echo ""
          for f in output/dartvm_*.so; do
            [ -f "$f" ] && file "$f"
          done

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine_${{ matrix.dart-version }}
          path: output/dartvm_${{ matrix.dart-version }}_*.so
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # STAGE 3: Package runtime libs + per-version engines into separate 7z
  # ══════════════════════════════════════════════════════════
  package-release:
    name: Package 7z Release (runtime libs + per-version)
    needs: [shared-libs, build-engines]
    if: always() && (needs.shared-libs.result == 'success' && needs.build-engines.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Download shared libs
        uses: actions/download-artifact@v4
        with:
          name: shared_libs
          path: staging/shared_libs

      - name: Download all engine artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging/engines

      - name: Assemble runtime libs archive (mandatory)
        run: |
          mkdir -p release/runtime/lib
          echo "=== Runtime libs (mandatory: libc++_shared.so) ==="
          # ICU 不随包：dartvm.so 在构建期已跳过 ICU 链接（CMake 仅当 ICU 库存在才 link，
          # 见 dartvm/CMakeLists.txt），readelf 无 NEEDED libicuuc/libicudata。
          # 若未来某版本出现 ICU NEEDED，需回归本包。
          cp staging/shared_libs/libc++_shared.so release/runtime/lib/
          ls -lh release/runtime/lib/

      - name: Assemble per-version engine archives
        run: |
          mkdir -p release/engines
          echo "=== DartVM engines (per-version archives) ==="
          for dir in staging/engines/engine_*/; do
            [ -d "$dir" ] || continue
            for so in "$dir"*.so; do
              [ -f "$so" ] || continue
              ver=$(echo "$so" | grep -oP 'dartvm_\K[0-9.]+')
              mkdir -p "release/engines/dartvm-${ver}"
              cp "$so" "release/engines/dartvm-${ver}/dartvm_${ver}.so"
              echo "  Staged: dartvm_${ver}.so ($(ls -lh "$so" | awk '{print $5}'))"
            done
          done

      - name: Create 7z archives
        run: |
          # 7-Zip 23.00+ 会自动为 ARM64 ELF 可执行文件加 ARM64 BCJ filter
          # （方法 ID 0x0A），commons-compress 不支持该 filter（会报
          # "Unsupported compression method [10]"），故一律 -mf=off 禁用过滤器，
          # 确保纯 LZMA2（与旧整包一致）。
          # 运行库包：内含 lib/libc++_shared.so（解压到 engines/ 后落 engines/lib/）
          cd release/runtime
          7z a -mx=9 -m0=lzma2 -mf=off ../fler-runtime-libs.7z lib/
          cd ../..
          # 每版本包：内含 dartvm_<v>.so（解压到 engines/ 后落 engines/dartvm_<v>.so，
          # 增量共存，不覆盖其它已装版本）。归档统一放 release/ 根，便于 Release 上传。
          for dir in release/engines/dartvm-*/; do
            [ -d "$dir" ] || continue
            ver=$(basename "$dir")
            cd "$dir"
            7z a -mx=9 -m0=lzma2 -mf=off "../../${ver}.7z" dartvm_*.so
            cd ../../..
          done
          echo ""
          echo "=== 7z archives ==="
          ls -lh release/*.7z
          echo ""
          echo "=== Runtime libs archive listing ==="
          7z l release/fler-runtime-libs.7z

      - name: Verify archives are commons-compress decodable
        run: |
          set -e
          echo "=== Method per file (must NOT contain ARM64/BCJ/BCJ2) ==="
          for f in release/*.7z; do
            if 7z l -slt "$f" | grep -E "Method = .*(ARM64|BCJ|BCJ2)" ; then
              echo "ERROR: $f contains unsupported filters (ARM64/BCJ/BCJ2)"
              exit 1
            fi
            echo "OK (no filters): $f"
          done
          echo ""
          echo "=== Integrity test ==="
          for f in release/*.7z; do
            7z t "$f" > /dev/null
            echo "OK (test): $f"
          done

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.7z > checksums.txt
          cat checksums.txt
          cd ..

      - name: Upload 7z package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fler-engines-release
          path: |
            release/fler-runtime-libs.7z
            release/dartvm-*.7z
            release/checksums.txt
          retention-days: 90

  # ══════════════════════════════════════════════════════════
  # STAGE 4: Create GitHub Release (tag pushes only)
  # ══════════════════════════════════════════════════════════
  release:
    name: Create Release
    needs: [shared-libs, build-engines, package-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download 7z package
        uses: actions/download-artifact@v4
        with:
          name: fler-engines-release
          path: release-assets

      - name: Generate release summary
        run: |
          cd release-assets
          echo "Release assets:"
          ls -lh
          echo ""
          for f in *.7z; do
            echo "--- $f ---"
            7z l "$f" 2>/dev/null | tail -n +16 || true
          done
          echo "--- checksums.txt ---"
          cat checksums.txt 2>/dev/null || echo ""

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: fler-engines ${{ github.ref_name }} — Per-Version Engine Packages
          body: |
            ## fler-engines ${{ github.ref_name }} — Per-Version Engine Packages

            On-demand per-Dart-version engine packages + mandatory runtime libs.

            ### Package Contents
            - **Runtime libs (mandatory)**: `fler-runtime-libs.7z` → `lib/libc++_shared.so`
            - **Engines (per-version)**: `dartvm-<version>.7z`, each containing a single `dartvm_<version>.so` (82 versions)

            ### Architecture
            - **ABI**: arm64-v8a (Android ARM64)
            - **Static Capstone**: Capstone statically linked into each `dartvm_*.so`
            - **ICU**: not bundled (dartvm built without ICU dependency)
            - **rpath**: `$ORIGIN` for runtime shared lib resolution

            ### Usage (Fler App)
            The Fler app reads `manifest.json` (main branch) to list available remote Dart
            versions and downloads the chosen engine on demand. See `fler-engine-on-demand-download`.

            ### Installation Layout
            ```
            engines/
            ├── lib/libc++_shared.so          ← from fler-runtime-libs.7z
            └── dartvm_3.12.2.so             ← from dartvm-3.12.2.7z
            ```
          files: |
            release-assets/fler-runtime-libs.7z
            release-assets/dartvm-*.7z
            release-assets/checksums.txt

      - name: Generate manifest.json
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_NOTES='${{ env.RELEASE_NOTES }}'
          # 动态取当前仓库（fork/改名后 manifest 内资产 URL 仍指向本仓库 Release）
          BASE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          cd release-assets

          RT_SHA=$(sha256sum fler-runtime-libs.7z | awk '{print $1}')
          RT_SIZE=$(wc -c < fler-runtime-libs.7z)

          ENGINES_JSON=""
          for f in dartvm-*.7z; do
            [ -f "$f" ] || continue
            ver=$(echo "$f" | sed -E 's/^dartvm-([0-9.]+)\.7z$/\1/')
            sha=$(sha256sum "$f" | awk '{print $1}')
            size=$(wc -c < "$f")
            [ -n "$ENGINES_JSON" ] && ENGINES_JSON="$ENGINES_JSON,"
            ENGINES_JSON="$ENGINES_JSON { \"dartVersion\": \"$ver\", \"file\": \"$f\", \"url\": \"$BASE/$f\", \"sha256\": \"$sha\", \"sizeBytes\": $size }"
          done

          # 写到仓库根（工作区），供 Commit manifest.json 步骤读取
          cat > ../manifest.json <<EOF
          {
            "packVersion": "$TAG",
            "releaseNotes": "$RELEASE_NOTES",
            "runtimeLibs": {
              "file": "fler-runtime-libs.7z",
              "url": "$BASE/fler-runtime-libs.7z",
              "sha256": "$RT_SHA",
              "sizeBytes": $RT_SIZE
            },
            "engines": [$ENGINES_JSON]
          }
          EOF
          echo "=== manifest.json ==="
          cat ../manifest.json

      - name: Commit manifest.json to main
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const path = 'manifest.json';
            const content = fs.readFileSync(path, 'utf8');
            let sha = null;
            try {
              sha = (await github.rest.repos.getContent({ owner, repo, path, ref: 'main' })).data.sha;
            } catch (_) {}
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              branch: 'main',
              content: Buffer.from(content).toString('base64'),
              message: 'chore: update manifest.json for ' + context.ref.split('/').pop(),
              sha: sha || undefined,
            });